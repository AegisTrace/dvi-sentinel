schema_version: "1"
metadata:
  id: example-flow
  title: Synthetic documentation flow
  description: Local event-model fixture for scenario validation.
inputs:
  - path: canonical_event.json
    format: jsonl
    provenance: synthetic
expected:
  detector: fixture-lab
  signature: synthetic-flow
harness:
  kind: rule_logic
  rules:
    - id: flow-rule
      detector: fixture-lab
      signature: synthetic-flow
      title: Synthetic flow observation
      conditions:
        - field: category
          operator: eq
          value: flow
variations:
  families: [timing, metadata]
  max_jitter_ms: 25
  optional_fields: [sensor, vendor]
safety:
  local_only: true
  synthetic_only: true
  no_execution: true
