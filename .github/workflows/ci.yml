name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/dvi_sentinel
      - run: python -m coverage run -m pytest
      - run: python -m coverage report --fail-under=90
      - run: python -m coverage xml
      - run: python -m build
      - name: Install the built wheel in an isolated environment
        run: |
          python -m venv .venv-package
          .venv-package/bin/python -m pip install dist/*.whl
          .venv-package/bin/python -m pip check
      - name: Inspect the installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/.venv-package/bin/dvi" doctor --json
          "$GITHUB_WORKSPACE/.venv-package/bin/python" -m dvi_sentinel.cli.main --version
      - name: Run the bounded robust fixture through the installed CLI
        run: |
          .venv-package/bin/dvi run examples/foundation_scenario.yaml --out runs/ci --seed 42 --event-budget 256 --json
          .venv-package/bin/dvi ci-check runs/ci --threshold 1 --json
      - name: Record the V1 fixture benchmarks through the installed package
        run: .venv-package/bin/python examples/run_benchmarks.py --out runs/benchmarks/benchmark_report.json
      - name: Verify all sixteen V2 expert categories through the installed package
        run: .venv-package/bin/python examples/run_v2_benchmarks.py --out runs/benchmarks/v2
      - name: Retain local fixture evidence and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dvi-evidence-py${{ matrix.python }}
          path: |
            runs/ci/
            runs/benchmarks/benchmark_report.json
            runs/benchmarks/v2/
            coverage.xml
          retention-days: 7
          if-no-files-found: warn
