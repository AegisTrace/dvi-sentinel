schema_version: '1'
metadata:
  id: benchmark:optional_field-fragile
  title: optional field fragile
  description: Synthetic local evidence for optional_field with a deliberately sensitive
    observation.
inputs:
- path: events.jsonl
  format: jsonl
  provenance: synthetic
expected:
  detector: benchmark-lab
  signature: synthetic-observation
  min_severity: 4
harness:
  kind: rule_logic
  rules:
  - id: observation
    detector: benchmark-lab
    signature: synthetic-observation
    title: Synthetic benchmark observation
    conditions:
    - field: sensor
      operator: exists
    min_count: 2
    severity: 4
variations:
  max_variants: 8
  families:
  - dropout
  optional_fields:
  - sensor
safety:
  local_only: true
  synthetic_only: true
  no_execution: true
