schema_version: '1'
metadata:
  id: benchmark:adapter_disagreement-fragile
  title: adapter disagreement fragile
  description: Synthetic local evidence for adapter_disagreement with a deliberately
    sensitive observation.
inputs:
- path: events.jsonl
  format: jsonl
  provenance: synthetic
expected:
  detector: benchmark-lab
  signature: synthetic-observation
  min_severity: 4
harness:
  kind: rule_logic
  rules:
  - id: observation
    detector: benchmark-lab
    signature: synthetic-observation
    title: Synthetic benchmark observation
    conditions:
    - field: action
      operator: eq
      value: observed
    - field: severity
      operator: gte
      value: 4
    min_count: 2
    severity: 4
variations:
  max_variants: 8
safety:
  local_only: true
  synthetic_only: true
  no_execution: true
