schema_version: '1'
metadata:
  id: benchmark:benign_noise-fragile
  title: benign noise fragile
  description: Synthetic local evidence for benign_noise with a deliberately sensitive
    observation.
inputs:
- path: events.jsonl
  format: jsonl
  provenance: synthetic
expected:
  detector: benchmark-lab
  signature: synthetic-observation
  min_severity: 4
harness:
  kind: rule_logic
  rules:
  - id: observation
    detector: benchmark-lab
    signature: synthetic-observation
    title: Synthetic benchmark observation
    conditions:
    - field: action
      operator: eq
      value: observed
    - field: severity
      operator: gte
      value: 4
    min_count: 2
    severity: 4
    max_total_events: 2
variations:
  max_variants: 8
  families:
  - noise
  max_noise_events: 2
safety:
  local_only: true
  synthetic_only: true
  no_execution: true
