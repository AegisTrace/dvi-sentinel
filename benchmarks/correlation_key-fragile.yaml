schema_version: '1'
metadata:
  id: benchmark:correlation_key-fragile
  title: correlation key fragile
  description: Synthetic local evidence for correlation_key with a deliberately sensitive
    observation.
inputs:
- path: events.jsonl
  format: jsonl
  provenance: synthetic
expected:
  detector: benchmark-lab
  signature: synthetic-observation
  min_severity: 4
harness:
  kind: rule_logic
  rules:
  - id: observation
    detector: benchmark-lab
    signature: synthetic-observation
    title: Synthetic benchmark observation
    conditions:
    - field: correlation_id
      operator: eq
      value: '123'
    min_count: 2
    severity: 4
variations:
  max_variants: 8
  families:
  - dropout
  optional_fields:
  - correlation_id
safety:
  local_only: true
  synthetic_only: true
  no_execution: true
